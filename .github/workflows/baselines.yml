name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly — catch drift when deps/tasks break without a full model re-bench
    - cron: "0 6 * * 1"

jobs:
  smoke-and-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # live model vet is not ci-safe (needs keys) — static shape check instead
      - run: npm run vet-tasks -- --static
      - run: npm run build
      - name: Challenge results present
        run: |
          test -f data/challenges/niche-sprint-v1/results.json
          test -f data/challenges/drawing-contest-v1/results.json
          test -f data/challenges/game-night-v1/results.json
          test -f data/challenges/slop-chaos-v1/results.json
          test -f data/challenges/trap-season-v2/results.json
          test -f data/tasks/trap_season.json
